apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-container-security
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Containers must run as non-root."
        pattern:
          spec:
            containers:
              - securityContext:
                  runAsNonRoot: true

    - name: disallow-latest-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Using the latest image tag is prohibited."
        pattern:
          spec:
            containers:
              - image: "!*:latest"